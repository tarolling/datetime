name: CI

on:
  push:
    branches: [main]
  pull_request:

# The oldest stone this package supports, which `stone = "0.4.5"` in stone.toml promises.
env:
  STONE_VERSION: v0.4.5

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stone (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/tarolling/stone/main/install.sh | sh -s -- --dir "$HOME/.stone/bin"
          echo "$HOME/.stone/bin" >> "$GITHUB_PATH"

      - name: Install stone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STONE_INSTALL_DIR = "$HOME\.stone\bin"
          $env:STONE_NO_MODIFY_PATH = "1"
          irm https://raw.githubusercontent.com/tarolling/stone/main/install.ps1 | iex
          "$HOME\.stone\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: stone --version

      - name: Check formatting
        if: runner.os == 'Linux'
        run: stone fmt --check

      - name: Test (interpreter)
        run: stone test

      - name: Test (native code)
        run: stone test --build

      - name: Run the tour, interpreted and compiled
        if: runner.os != 'Windows'
        working-directory: examples
        run: |
          stone run tour.stn | sed '$d' > run.txt
          stone build tour.stn
          ./build/tour | sed '$d' > build.txt
          diff run.txt build.txt
