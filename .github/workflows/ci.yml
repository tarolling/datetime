name: CI

on:
  push:
    branches: [main]
  pull_request:

# Diagnostic run: compiled lib.stn tests crash with a signal on macOS (aarch64) under stone
# 0.4.4, while compiled programs that use the package run. This compares 0.4.3 and 0.4.4 there
# and gets a backtrace from one compiled lib.stn test.
jobs:
  test:
    name: test (${{ matrix.os }}, stone ${{ matrix.stone }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        stone: [v0.4.3, v0.4.4]
    runs-on: ${{ matrix.os }}
    env:
      STONE_VERSION: ${{ matrix.stone }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install stone
        run: |
          curl -fsSL https://raw.githubusercontent.com/tarolling/stone/main/install.sh | sh -s -- --dir "$HOME/.stone/bin"
          echo "$HOME/.stone/bin" >> "$GITHUB_PATH"

      - run: stone --version

      - name: Let stone 0.4.3 build the package
        if: matrix.stone == 'v0.4.3'
        run: sed -i '' 's/^stone = "0.4.4"/stone = "0.4.3"/' stone.toml examples/stone.toml

      - name: Test (interpreter)
        continue-on-error: true
        run: stone test

      - name: Test (native code)
        continue-on-error: true
        run: stone test --build

      - name: Backtrace of one compiled lib.stn test
        continue-on-error: true
        run: |
          stone test --build --filter "building dates" lib.stn || true
          line=$(grep -n '^test "building dates":' lib.stn | cut -d: -f1)
          echo "STONE_TEST=test.$line.1"
          STONE_TEST="test.$line.1" ./build/test/lib || echo "exit status $?"
          STONE_TEST="test.$line.1" lldb --batch -o run -k "bt 30" -k "register read" \
            -k "disassemble --pc --count 24" -k "disassemble --start-address \$lr --count 8" ./build/test/lib || true

      - name: Segment layout of the lib.stn test binary
        continue-on-error: true
        run: |
          pagesize
          ls -l build/test/lib
          otool -l build/test/lib | grep -E -A10 "cmd LC_SEGMENT_64" | grep -E "segname|vmaddr|vmsize|fileoff|filesize|nsects"
          otool -l build/test/lib | grep -E -A6 "sectname" | grep -E "sectname|segname|addr|size|offset"
          nm build/test/lib | grep -E "free_blocks|stone\.heap|_end$" || true
          addr=$(nm build/test/lib | awk '/stone.free_blocks/{print $1; exit}')
          echo "stone.free_blocks at 0x$addr"
          otool -l build/test/lib | grep -A3 LC_SYMTAB -m1 || true
          otool -l build/test/lib | grep -E -A4 "cmd LC_SYMTAB" | grep -E "stroff|strsize|symoff" || true

      - name: Compare the zero-fill page with the file
        continue-on-error: true
        run: |
          line=$(grep -n '^test "building dates":' lib.stn | cut -d: -f1)
          echo "== file bytes at offsets 0xcf538 (free_blocks) and 0xcf568 (free_blocks+48)"
          xxd -s 0xcf538 -l 64 build/test/lib
          echo "== file bytes at 0xcc000 (start of __DATA's zero-fill page)"
          xxd -s 0xcc000 -l 32 build/test/lib
          echo "== load commands"
          otool -l build/test/lib | grep -E "^ +cmd " | sort | uniq -c
          echo "== memory of the crashed process"
          STONE_TEST="test.$line.1" lldb --batch -o run -k "memory read --size 1 --count 64 0x1000cf538" \
            -k "memory read --size 1 --count 32 0x1000cc000" -k "image dump sections lib" ./build/test/lib || true

      - name: Sweep program sizes
        continue-on-error: true
        working-directory: repro
        run: |
          sizes="50 100 200 300 400 500 600 700 800 900 1000 1200 1400 1600 1800 2000 2500 3000"
          python3 -I gen.py $sizes
          for n in $sizes; do
            stone build globs$n.stn > /dev/null
            if out=$(./build/globs$n 2>&1); then status=0; else status=$?; fi
            printf 'N=%-5s exit=%-4s %s\n' "$n" "$status" "$(echo "$out" | head -1)"
            python3 -I macho.py build/globs$n
          done
