name: CI

on:
  push:
    branches: [main]
  pull_request:

# Diagnostic run: compiled lib.stn tests crash with a signal on macOS (aarch64) under stone
# 0.4.4. This compares 0.4.3 and 0.4.4 there and gets a backtrace from a small program.
jobs:
  test:
    name: test (${{ matrix.os }}, stone ${{ matrix.stone }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        stone: [v0.4.3, v0.4.4]
    runs-on: ${{ matrix.os }}
    env:
      STONE_VERSION: ${{ matrix.stone }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install stone
        run: |
          curl -fsSL https://raw.githubusercontent.com/tarolling/stone/main/install.sh | sh -s -- --dir "$HOME/.stone/bin"
          echo "$HOME/.stone/bin" >> "$GITHUB_PATH"

      - run: stone --version

      - name: Test (interpreter)
        continue-on-error: true
        run: stone test

      - name: Test (native code)
        continue-on-error: true
        run: stone test --build

      - name: Build and run small programs
        continue-on-error: true
        working-directory: examples
        run: |
          cat > date.stn <<'EOF'
          use datetime.Date
          print(Date.of(2026, 11, 6).unwrap())
          EOF
          cat > zone.stn <<'EOF'
          use datetime.TimeZone
          print(TimeZone.get("America/Chicago").unwrap().name)
          EOF
          for p in date zone tour; do
            echo "== $p"
            stone build $p.stn
            ./build/$p; echo "exit status $?"
          done

      - name: Backtraces
        continue-on-error: true
        working-directory: examples
        run: |
          for p in date tour; do
            echo "== $p"
            lldb --batch -o run -o bt -o "register read pc lr sp" -o "disassemble --pc --count 12" ./build/$p || true
          done
